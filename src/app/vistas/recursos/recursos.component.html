<div class="container">
  <div class="d-flex justify-content-between align-items-center flex-wrap mb-3">
    <h3 class="mb-0">Lista de Recursos</h3>
    <div class="input-group" style="width: 240px;">
      <input type="text" [(ngModel)]="filtroNombre" class="form-control" placeholder="Buscar" (keyup.enter)="filtrar()" />
      <button class="btn btn-primary" (click)="filtrar()">
        <i class="fas fa-search"></i>
      </button>
    </div>
  </div>

  <div class="d-flex mb-3">
    <div>
      <button type="button" class="btn btn-primary mb-2" (click)="nuevoRecurso()">
        <i class="fas fa-chalkboard-teacher"></i> Agregar Recurso
      </button>
    </div>
    <div id="btnExport" class="ml-2">
      <button class="btn btn-custom" (click)="exportToExcel()">Exportar a Excel</button>
    </div>
  </div>

  <div class="d-flex justify-content-end align-items-center mb-3">
    <div class="ml-auto" id="navPages">
      <pagination-controls (pageChange)="pageChanged($event)" [autoHide]="hidePageNumbers" [maxSize]="maxSize"></pagination-controls>
    </div>
  </div>

  <div class="table-responsive">
    <table class="table">
      <caption>Lista de Encargados</caption>
      <thead>
        <tr>
          <th scope="col">#</th>
          <th scope="col">Articulo</th>
          <th scope="col">Locker</th>
          <th scope="col">Cantidad</th>
          <th scope="col">Descripcion</th>
        </tr>
      </thead>
      <tbody>
        @for (recurso of recursos | paginate: { itemsPerPage: itemsPerPage, currentPage: currentPage, totalItems: totalItems }; track recurso.recursosId) {
          <tr>
            <th scope="row">{{ (currentPage - 1) * itemsPerPage + $index + 1 }}</th>
            <td><input class="cell-input" [(ngModel)]="recurso.articulo" (blur)="guardarRecurso(recurso)" (keyup.enter)="guardarRecurso(recurso)" /></td>
            <td><input class="cell-input" type="number" [(ngModel)]="recurso.numero_Locker" (blur)="guardarRecurso(recurso)" (keyup.enter)="guardarRecurso(recurso)" /></td>
            <td><input class="cell-input" type="number" [(ngModel)]="recurso.cantidad" (blur)="guardarRecurso(recurso)" (keyup.enter)="guardarRecurso(recurso)" /></td>
            <td><input class="cell-input" [(ngModel)]="recurso.descripcion" (blur)="guardarRecurso(recurso)" (keyup.enter)="guardarRecurso(recurso)" /></td>
          </tr>
        }
      </tbody>
    </table>
  </div>
  <div class="d-flex justify-content-end align-items-center mb-3">
    <div class="ml-auto" id="navPages">
      <pagination-controls (pageChange)="pageChanged($event)" [maxSize]="maxSize"></pagination-controls>
    </div>
  </div>
</div>
