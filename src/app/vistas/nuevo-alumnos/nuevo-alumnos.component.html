<div class="nuevo">
  <div class="page-head">
    <h1>Nuevo alumno</h1>
    <p>Completa los datos del estudiante</p>
  </div>

  <div class="card">
    <form [formGroup]="nuevoForm" (ngSubmit)="postForm(nuevoForm.value)">
      <div class="form-grid">
        <div class="field">
          <label>Nombre</label>
          <input type="text" formControlName="nombre" placeholder="Nombre del alumno" />
        </div>
        <div class="field">
          <label>Apellido</label>
          <input type="text" formControlName="apellido" placeholder="Apellido del alumno" />
        </div>
        <div class="field">
          <label>Fecha de nacimiento</label>
          <input type="date" formControlName="fechaNacimiento" />
        </div>
        <div class="field">
          <label>Padre o madre</label>
          <select formControlName="encargadoId">
            <option value="">Seleccione</option>
            @for (encargado of encargados; track encargado.encargadoId) {
              <option [value]="encargado.encargadoId">{{ encargado.nombre }} {{ encargado.apellido }}</option>
            }
          </select>
        </div>
        <div class="field">
          <label>Clase</label>
          <select formControlName="edadId">
            <option value="">Seleccione</option>
            @for (edad of edades; track edad.edadId) {
              <option [value]="edad.edadId">{{ edad.rangoEdad }}</option>
            }
          </select>
        </div>
      </div>

      <div class="actions">
        <button type="button" class="btn-ghost" (click)="salir()">Atrás</button>
        <button type="submit" class="btn-primary">Guardar</button>
      </div>
    </form>
  </div>
</div>
