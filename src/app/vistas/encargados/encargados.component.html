<div class="container">
  <div class="d-flex justify-content-between align-items-center flex-wrap mb-3">
    <h3 class="mb-0">Lista de Padres</h3>
    <div class="input-group" style="width: 240px;">
      <input type="text" [(ngModel)]="filtroNombre" class="form-control" placeholder="Buscar" (keyup.enter)="filtrar()" />
      <button class="btn btn-primary" (click)="filtrar()">
        <i class="fas fa-search"></i>
      </button>
    </div>
  </div>

  <div>
    <button type="button" class="btn btn-primary mb-2" (click)="nuevoEncargado()">
      <i class="fas fa-chalkboard-teacher"></i> Agregar Encargado
    </button>
  </div>

  <div class="d-flex justify-content-end align-items-center mb-3">
    <div class="ml-auto" id="navPages">
      <pagination-controls (pageChange)="pageChanged($event)" [maxSize]="maxSize"></pagination-controls>
    </div>
  </div>

  <div class="table-responsive">
    <table class="table">
      <caption>Lista de Encargados</caption>
      <thead>
        <tr>
          <th scope="col">#</th>
          <th scope="col">Nombre</th>
          <th scope="col">Apellido</th>
          <th scope="col">Direccion</th>
          <th scope="col">E-mail</th>
          <th scope="col">Teléfono</th>
          <th scope="col"></th>
        </tr>
      </thead>
      <tbody>
        @for (encargado of encargados | paginate: { itemsPerPage: itemsPerPage, currentPage: currentPage, totalItems: totalItems }; track encargado.encargadoId) {
          <tr>
            <th scope="row">{{ (currentPage - 1) * itemsPerPage + $index + 1 }}</th>
            <td><input class="cell-input" [(ngModel)]="encargado.nombre" (blur)="guardarEncargado(encargado)" (keyup.enter)="guardarEncargado(encargado)" /></td>
            <td><input class="cell-input" [(ngModel)]="encargado.apellido" (blur)="guardarEncargado(encargado)" (keyup.enter)="guardarEncargado(encargado)" /></td>
            <td><input class="cell-input" [(ngModel)]="encargado.direccion" (blur)="guardarEncargado(encargado)" (keyup.enter)="guardarEncargado(encargado)" /></td>
            <td><input class="cell-input" [(ngModel)]="encargado.email" (blur)="guardarEncargado(encargado)" (keyup.enter)="guardarEncargado(encargado)" /></td>
            <td><input class="cell-input" [(ngModel)]="encargado.telefono" (blur)="guardarEncargado(encargado)" (keyup.enter)="guardarEncargado(encargado)" /></td>
            <td>
              <button class="btn-delete" (click)="borrarEncargado(encargado)" title="Eliminar"><i class="fa-solid fa-trash"></i></button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
  <div class="d-flex justify-content-end align-items-center">
    <div class="ml-auto" id="navPages">
      <pagination-controls (pageChange)="pageChanged($event)" [maxSize]="maxSize"></pagination-controls>
    </div>
  </div>
</div>
