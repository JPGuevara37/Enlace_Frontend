<div class="nuevo">
  <div class="page-head">
    <h1>Nuevo profesor</h1>
    <p>Completa los datos del maestro</p>
  </div>

  <div class="card">
    <form [formGroup]="nuevoForm" (ngSubmit)="postForm(nuevoForm.value)">
      <div class="form-grid">
        <div class="field">
          <label>Nombre</label>
          <input type="text" formControlName="nombre" placeholder="Nombre del profesor" />
        </div>
        <div class="field">
          <label>Apellido</label>
          <input type="text" formControlName="apellido" placeholder="Apellido del profesor" />
        </div>
        <div class="field">
          <label>Email</label>
          <input type="text" formControlName="email" placeholder="Email del profesor" />
        </div>
        <div class="field">
          <label>Teléfono</label>
          <input type="text" formControlName="telefono" placeholder="Teléfono del profesor" />
        </div>
        <div class="field">
          <label>Categoría</label>
          <select formControlName="categoria">
            <option value="Líder">Líder</option>
            <option value="Profesor">Profesor</option>
            <option value="Asistente">Asistente</option>
          </select>
        </div>
        <div class="field">
          <label>Foto</label>
          <div class="foto-field">
            <img class="foto-preview" [src]="avatarPreview" alt="Foto" />
            <label class="file-picker">
              <i class="fa-solid fa-image"></i> Elegir foto
              <input type="file" accept="image/*" (change)="onFotoSeleccionada($event)" />
            </label>
            @if (avatarPreview) {
              <button type="button" class="btn-ghost" (click)="quitarFoto()">Quitar</button>
            }
          </div>
        </div>
      </div>

      <div class="actions">
        <button type="button" class="btn-ghost" (click)="salir()">Atrás</button>
        <button type="submit" class="btn-primary">Guardar</button>
      </div>
    </form>
  </div>
</div>
